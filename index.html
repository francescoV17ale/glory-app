<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5f99">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Glory 2.0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Glory 2.0</title>
<style>
:root{--bg:#f2f4f5;--sf:#fff;--tx:#14191d;--mu:#5b6770;--ln:#d5dbdf;--ac:#1f5f99;--on:#fff;--ok:#1f7a4d;--dg:#c23b22;--dgo:#fff;--wn:#9a5b00;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101417;--sf:#1a2025;--tx:#e8edf0;--mu:#97a4ad;--ln:#2d363d;--ac:#6fb3ea;--on:#0b1620;--ok:#5fc78f;--dg:#ff8a75;--dgo:#2a0a06;--wn:#f0b04a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101417;--sf:#1a2025;--tx:#e8edf0;--mu:#97a4ad;--ln:#2d363d;--ac:#6fb3ea;--on:#0b1620;--ok:#5fc78f;--dg:#ff8a75;--dgo:#2a0a06;--wn:#f0b04a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button{cursor:pointer}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--ln);padding:12px 16px;display:flex;align-items:center;gap:12px}
header h1{font-size:18px;margin:0;flex:1;font-weight:650}
.back{min-height:44px;min-width:44px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:10px;font-size:15px;padding:0 12px}
main{max-width:640px;margin:0 auto;padding:16px 16px 48px}
.card{display:block;width:100%;text-align:left;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:14px 16px;margin-bottom:10px;color:var(--tx);font:inherit;min-height:64px;text-decoration:none}
.card b{display:block;font-size:17px;margin-bottom:2px;overflow-wrap:anywhere}
.card span{color:var(--mu);font-size:14px}
.card.arcc{border-color:var(--ac)}
.pcx{margin:0 0 12px}.pcx>b{display:block}.pcx>span{display:block;font-size:13px;color:var(--mu);margin-bottom:8px}
.card.aok{border-left:6px solid var(--ok)}.card.aok b{color:var(--ok)}.card.aok span{color:var(--ok)}
.card.acor{border-left:6px solid var(--wn)}.card.aatt{border-left:6px solid var(--ac)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.new{min-height:64px;border:1px solid var(--ac);background:var(--sf);color:var(--ac);border-radius:12px;font:inherit;font-weight:650;padding:8px 10px}
.bar{height:6px;background:var(--ln);border-radius:3px;margin:0 0 4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0}
.cnt{color:var(--mu);font-size:13px;margin:0 0 12px}
.cnt.bw{color:var(--dg);font-weight:600}
h2{font-size:17px;margin:24px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--ac)}
h3{font-size:15px;margin:16px 0 6px;color:var(--mu);font-weight:600}
.rowc{display:flex;gap:8px;margin-bottom:8px}
.pvw{border:1px solid var(--ln);border-radius:10px;padding:10px;margin:10px 0 12px;background:var(--sf);font-size:13px}
.pvh{display:flex;justify-content:space-between;gap:8px;background:var(--ac);color:var(--on);border-radius:6px;padding:8px 10px;margin-bottom:8px}
.pvi{background:var(--bg);border-left:3px solid var(--ac);padding:6px 10px;margin-bottom:8px;display:grid;grid-template-columns:1fr;gap:2px 10px;overflow-wrap:anywhere}
.pvs{background:var(--bg);border-left:3px solid var(--ac);padding:4px 8px;margin:10px 0 4px;font-weight:700}
.pvt{color:var(--ac);font-size:11px;font-weight:700;text-transform:uppercase;margin:6px 0 2px}
.pvc{padding:2px 0;color:var(--mu)}.pvc.on{color:var(--tx);font-weight:700}
.pvf{display:flex;justify-content:space-between;gap:10px;padding:2px 0;border-bottom:1px solid var(--ln)}.pvf span{color:var(--mu)}.pvf b{text-align:right;font-weight:400;overflow-wrap:anywhere}
.pvn{color:var(--mu);font-style:italic;padding:2px 0}
.pvp{display:flex;flex-wrap:wrap;gap:6px}.pvp img{width:72px;height:72px;object-fit:cover;border-radius:6px;border:1px solid var(--ln)}
.chk{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:10px 14px;margin-bottom:8px;background:var(--sf);border:1px solid var(--ln);border-radius:10px;color:var(--tx);font:inherit;text-align:left}
.rowc .chk{margin:0;flex:1;min-width:0}
.chk .bx{flex:none;width:28px;height:28px;border:2px solid var(--mu);border-radius:7px;display:grid;place-items:center;font-weight:700;color:var(--on)}
.chk.on{border-color:var(--ok)}
.chk.on .bx{background:var(--ok);border-color:var(--ok)}
.chk.on .lb{color:var(--mu);text-decoration:line-through}
.chk.dg{border-color:var(--dg)}
.chk.dg .bx{background:var(--dg);border-color:var(--dg);color:var(--dgo)}
.chk.dg .lb{color:var(--tx);text-decoration:none}
.nb{flex:none;min-width:58px;border:1px solid var(--ln);background:var(--sf);color:var(--mu);border-radius:10px;font:inherit;font-size:13px}
.nb.has{border-color:var(--ac);color:var(--ac);font-weight:650}
.nta{min-height:72px;margin:0 0 10px}
.fld{margin-bottom:12px}
.fld>label{display:block;font-size:14px;color:var(--mu);margin-bottom:6px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:96px;min-height:52px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:10px;font:inherit;padding:0 10px}
.seg button.on{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:650}
.seg button.dgf{background:var(--dg);border-color:var(--dg);color:var(--dgo);font-weight:650}
input[type=text],input[type=date],textarea,select{width:100%;min-height:52px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:10px;font:inherit;padding:12px}
textarea{min-height:110px;resize:vertical}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.reset{display:block;margin-top:28px;width:100%;min-height:52px;border:1px solid var(--ln);background:none;color:var(--mu);border-radius:10px;font:inherit}
.reset.ac{color:var(--ac);border-color:var(--ac);font-weight:650}
.reset.dgo{color:var(--dg);border-color:var(--dg)}
.reset.tight{margin:0 0 12px}
.box{border:2px solid var(--dg);border-radius:10px;padding:12px;margin:10px 0 12px}
.box.wn{border-color:var(--wn)}
.box .seg{margin-top:10px}
.fsm button{min-width:0;flex:1 1 30%;min-height:44px;font-size:14px;padding:0 6px}
.lock{max-width:380px;margin:12vh auto 0;text-align:center}
.lock img{width:88px;height:88px;border-radius:20px;margin-bottom:12px}
.lock h2{border:0;margin:0 0 4px}
.lock input[type=password]{width:100%;min-height:52px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:10px;font:inherit;padding:12px;margin:16px 0 10px;text-align:center}
.lock label.rm{display:flex;align-items:center;justify-content:center;gap:10px;min-height:44px;color:var(--mu)}
.lock label.rm input{width:22px;height:22px}
.cnt3{display:grid!important;grid-template-columns:repeat(3,1fr);gap:2px 8px}
.cnt3 button{min-width:0}
.cnt3 .lbl{min-height:18px;font-size:12px;line-height:18px;color:var(--ac);font-weight:650;text-align:center}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:8px 0 12px}
.mcard{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:8px 10px 10px;min-width:0}
.mcard b{display:block;font-size:14px;margin-bottom:2px}
.mcard label{display:block;font-size:12px;color:var(--mu);margin:6px 0 2px}
.mcard input[type=text]{min-height:40px;padding:8px;font-size:15px}
.rmaout{font:700 24px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.5px;text-align:center;padding:16px 10px;margin:8px 0 12px;background:var(--sf);border:2px solid var(--ac);border-radius:12px;overflow-wrap:anywhere;user-select:all}
.rmaout.empty{color:var(--mu);border-color:var(--ln)}
.dd{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:20;width:min(330px,calc(100vw - 24px));max-height:calc(100vh - 90px);overflow:auto;background:var(--sf);border:1px solid var(--ln);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:6px}
.ddh{font-size:12px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.03em;padding:10px 10px 4px}
.ddi{display:block;width:100%;text-align:left;min-height:52px;padding:8px 10px;border:0;border-radius:8px;background:none;color:var(--tx);font:inherit}
.ddi b{display:block;font-size:16px}.ddi span{display:block;font-size:13px;color:var(--mu)}
.ddi:hover,.ddi:focus-visible{background:var(--bg)}
.dd .box{margin:8px 4px}
.dd.inl{position:static;width:auto;max-height:none;box-shadow:none;margin:0 0 12px}
.dbtn{margin-top:10px!important}
.tecrm{display:flex;align-items:center;gap:10px;min-height:44px;color:var(--mu);font-size:14px;margin-top:4px}
.tecrm input{width:22px;height:22px;flex:none}
.hb{min-width:44px;font-weight:800;font-size:16px;color:var(--ac);border-color:var(--ac)}
.hb.has{background:var(--ac);color:var(--on)}
.hlr{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.hlr label{margin:0!important;color:var(--mu);font-size:14px}
.hlr .hb{min-height:36px}
.hlp{border:1px solid var(--ac);border-left-width:4px;background:var(--sf);border-radius:10px;padding:10px 12px;margin:-2px 0 10px;font-size:14px}
.hlp b{display:block;margin-bottom:4px;color:var(--ac)}
.hlp ul{margin:0;padding-left:20px}.hlp li{margin:3px 0}
.drow{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;margin:0 0 8px;min-height:52px;font:inherit;color:var(--tx)}
.drow b{flex:none;font-size:14px;white-space:nowrap}.drow span{flex:1;min-width:0;font-size:13px;color:var(--mu);overflow-wrap:anywhere}.drow i{font-style:normal}.drow i.imp{display:block;margin-top:2px}.drow i.miss{color:var(--dg)}.drow em{flex:none;font-style:normal;color:var(--ac)}
.ovl{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--bg);border-radius:14px;width:min(440px,100%);max-height:90vh;overflow:auto;padding:16px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.dlg h2{margin-top:0}.dlg .reset.dgo{margin-top:14px}
.numv{flex:1;min-height:52px;display:grid;place-items:center;font-size:20px;font-weight:650;border:1px solid var(--ln);border-radius:10px;background:var(--sf)}
.sw3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.sw3 button{min-height:52px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:10px;font:inherit;font-size:14px;padding:0 6px;line-height:1.15}
.sw3 .half{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.sw3 .half button{font-size:13px;padding:0 2px}
.sw3 button.on{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:650}
.wl{margin:6px 0 8px;padding-left:20px;font-size:14px}
header{flex-wrap:wrap}
#gear{font-size:20px;padding:0 10px}
.rail{flex:1 0 100%;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 1px}
.rail::-webkit-scrollbar{display:none}
.dot{flex:1 1 0;min-width:28px;max-width:60px;height:36px;border-radius:8px;border:2px solid var(--ln);background:var(--sf);color:var(--mu);font:inherit;font-size:15px;font-weight:700;padding:0}
.dot.part{border-color:var(--wn);color:var(--wn)}
.dot.done{background:var(--ok);border-color:var(--ok);color:var(--on)}
.dot.cur{outline:3px solid var(--ac);outline-offset:1px}
body.passi main{padding-bottom:120px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;gap:8px;justify-content:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--ln)}
.dock .ib{flex:none;min-width:54px;min-height:56px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:12px;font-size:24px}
.dock .ib:disabled{opacity:.35;cursor:default}
.dock .mid{flex:none;min-height:56px;padding:0 16px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:12px;font:inherit;font-weight:650}
.go{flex:1;max-width:440px;min-width:0;min-height:56px;border:2px solid var(--ac);background:var(--ac);color:var(--on);border-radius:12px;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;padding:4px 10px}
.go b{font-size:18px;text-transform:uppercase;letter-spacing:.04em}
.go span{font-size:12px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.go.wait{background:var(--sf);color:var(--ac)}
.eyeb{margin-top:6px;color:var(--ac);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
h2.ptitle{font-size:24px;margin:2px 0 14px;padding:0;border:0}
.allok{margin:0 0 12px;border:2px solid var(--ok);border-radius:10px;padding:12px;font-weight:600;color:var(--ok)}
.box>b{display:block;margin-bottom:4px}
.wlk{display:inline;background:none;border:0;padding:2px 0;margin:0;color:inherit;font:inherit;text-align:left;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.notev{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px;margin:10px 0 12px;font-size:15px;line-height:1.5}
.gap{background:#ffe08a;color:#3d2c00;border:0;border-radius:5px;padding:0 8px;font:inherit;font-weight:700}
.flash{animation:fl 1.6s ease-out;border-radius:10px}
@keyframes fl{0%{box-shadow:0 0 0 4px #ffcf4a}100%{box-shadow:0 0 0 4px transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none;outline:3px solid var(--wn)}}
.vopt{display:block;width:100%;text-align:left;background:var(--sf);border:2px solid var(--ln);border-radius:12px;padding:12px 14px;margin:0 0 10px;color:var(--tx);font:inherit}
.vopt b{display:block;font-size:17px}.vopt span{color:var(--mu);font-size:14px}
.vopt.on{border-color:var(--ac)}.vopt.on b{color:var(--ac)}
.ddtb{border-style:dashed!important;margin-bottom:12px!important}
.filebtn{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer}
.filebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.filebtn:focus-within{outline:3px solid var(--ac);outline-offset:2px}
.found{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:6px}
.found li{display:flex;justify-content:space-between;align-items:baseline;gap:10px;background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;font-variant-numeric:tabular-nums}
.found li span{flex:none;color:var(--mu);font-size:13px}.found li b{text-align:right;overflow-wrap:anywhere}
.tipb{font-size:14px;border:1px dashed var(--ac);border-radius:10px;padding:10px 12px;margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-4px 0 12px}
.chips span{font-size:13px;color:var(--mu)}
.chip{min-height:40px;padding:0 14px;border:1px dashed var(--ac);background:var(--sf);color:var(--ac);border-radius:20px;font:inherit;font-weight:650;font-variant-numeric:tabular-nums}
.chip.on{background:var(--ac);color:var(--on);border-style:solid}
.dlg textarea{margin:8px 0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.tile{display:flex;flex-direction:column;gap:5px;background:var(--sf);border:1px solid var(--ln);border-left:5px solid var(--ac);border-radius:10px;padding:12px 14px;min-height:84px;color:var(--tx);text-decoration:none;min-width:0}
.tile b{font-size:17px;line-height:1.2}
.tile span{font-size:13px;color:var(--mu);overflow-wrap:anywhere}
.tile.busy{border-left-color:var(--wn)}
.tile .bar{margin:2px 0 0}
.tile:last-child:nth-child(odd){grid-column:1/-1}
.tile{aspect-ratio:1/1;justify-content:center}
.tile:last-child:nth-child(odd){aspect-ratio:auto;min-height:84px}
.dlg .mseg{margin-bottom:12px}
.tmr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.tmr .tmb{display:flex;gap:8px;flex:none}
.tmr .tv{flex:1 1 auto;min-width:0;font:700 26px/1.1 ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.tmr .ts{display:block;font:500 13px system-ui,sans-serif;color:var(--mu)}
.tmr.run{border-color:var(--ok)}.tmr.run .ts{color:var(--ok);font-weight:650}
.tmr.pau{border-color:var(--wn)}.tmr.pau .ts{color:var(--wn);font-weight:650}
.tmr button{min-height:52px;min-width:78px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:10px;font:inherit;font-weight:650;padding:0 12px}
.tmr button.go1{background:var(--ac);border-color:var(--ac);color:var(--on)}
body.pv .tmr .tv{font-size:30px}
/* vista a passi: caratteri più grandi e marcati (menù e schede) */
body.pv{font-size:18px}
body.pv header h1{font-size:21px;font-weight:800}
body.pv h2{font-size:21px;font-weight:800}
body.pv h3{font-size:17px;font-weight:700}
body.pv h2.ptitle{font-size:31px;font-weight:800;line-height:1.1;letter-spacing:-.01em}
body.pv .eyeb{font-size:15px}
body.pv .cnt{font-size:15px}
body.pv .chk{min-height:64px;gap:16px;font-size:18px;font-weight:600}
body.pv .chk .bx{width:32px;height:32px}
body.pv .chk.on .lb{font-weight:500}
body.pv .nb{min-width:64px;font-size:15px}
body.pv .hb{font-size:19px}
body.pv .fld>label,body.pv .hlr label{font-size:16px;font-weight:650;color:var(--tx)}
body.pv input[type=text],body.pv input[type=date],body.pv textarea,body.pv select{font-size:18px;min-height:58px}
body.pv .seg button{min-height:58px;font-size:17px;font-weight:600}
body.pv .sw3 button{min-height:58px;font-size:16px;font-weight:600}
body.pv .reset{min-height:56px;font-size:17px}
body.pv .drow{min-height:60px}body.pv .drow b{font-size:17px}body.pv .drow span{font-size:15px}
body.pv .numv{font-size:24px}
body.pv .hlp{font-size:16px}
body.pv .tile{padding:14px 12px}

body.pv .tile:last-child:nth-child(odd){min-height:84px}
body.pv .tile b{font-size:18.5px;font-weight:800;overflow-wrap:break-word}
body.pv .tile span{font-size:15px}
body.pv .dot{height:42px;font-size:18px}
body.pv .go b{font-size:20px}body.pv .go span{font-size:13px}

body.pv .notev{font-size:17px}
.lnk{background:none;border:0;padding:0;color:var(--ac);text-decoration:underline;font:inherit;cursor:pointer;min-height:0}
