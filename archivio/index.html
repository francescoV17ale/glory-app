.fq{display:flex;justify-content:space-between;gap:8px}

.er .x{min-height:36px;min-width:36px;border:1px solid var(--dg);color:var(--dg);background:var(--sf);border-radius:8px}
a.b{display:inline-flex;align-items:center;text-decoration:none;color:var(--tx)}
.anl-x{}.dlg.anl{width:min(640px,100%)}.anb{display:grid;gap:4px;margin:4px 0 10px}.anr{display:grid;grid-template-columns:170px 1fr 40px;gap:8px;align-items:center;font-size:13px}.anr .anl{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.anw{height:10px;background:var(--bg);border-radius:5px;overflow:hidden}.anw i{display:block;height:100%;background:var(--ac);border-radius:5px}.anr b{text-align:right}
.qr{display:flex;gap:8px}.qr .q{flex:1;min-width:0}#fbt,#menub,.mback,.fmo{display:none}
@media (max-width:860px){header{position:static;padding:10px 12px;gap:8px}header h1{font-size:18px}header h1 span{display:none}
 body:not(.mopen) header>.b:not(#homeb):not(#menub):not(#appb),body:not(.mopen) header>label{display:none!important}body.mopen header>.b:not([hidden]),body.mopen header>label{display:inline-flex!important;align-items:center}#menub{display:inline-flex;align-items:center}.fil .lnk2{display:none}#appb:not([hidden]){display:inline-flex;align-items:center;text-decoration:none}
 main{padding:10px}.list{position:static;max-height:none}#fbt{display:inline-flex;align-items:center}

 .fmo{display:flex;gap:10px;align-items:center;background:var(--sf)}.fmh{position:sticky;top:0;z-index:1;padding:14px 0 10px;border-bottom:1px solid var(--ln)}.fmh b{flex:1;font-size:18px}
 .fft{position:sticky;bottom:0;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--ln);margin-top:14px}.fft .b{flex:1;justify-content:center}.fft .b.ac{flex:2}
 body.dsel .list,body.dsel .fil{display:none}.mback{display:inline-flex;align-items:center;margin-bottom:10px}}

<body>
<header>
 <a class="b" id="appb" href="../" hidden>‹ App</a>
 <button class="b" id="homeb" type="button" title="Torna all'elenco con i filtri di partenza">⌂ Home</button>
 <h1>Glory Archivio <span>sul PC</span></h1>
 <button class="b" id="menub" type="button" aria-expanded="false">☰ Menù</button>
 <label class="b ac" style="display:inline-flex;align-items:center;position:relative">Importa file<input id="fi" type="file" multiple accept=".txt,.json,text/plain,application/json" style="position:absolute;inset:0;opacity:0;cursor:pointer" aria-label="Importa file dall'app"></label>
 <button class="b" id="dirb" type="button"></button>
 <button class="b" id="sync" type="button" hidden title="Rileggi la cartella">Aggiorna</button>
 <button class="b" id="setb" type="button" title="Impostazioni">⚙ Impostazioni</button>
 <button class="b" id="nwlb" type="button">+ Nuovo lavoro</button>
 <button class="b" id="rmab" type="button">Genera RMA</button>
  <button class="b" id="tagb" type="button">Etichette</button>
 <button class="b" id="sqb" type="button">Squadra</button>
 <button class="b" id="anb" type="button">Analisi</button>
 <button class="b" id="csv" type="button">Esporta Excel</button>
 <button class="b" id="bak" type="button" title="Salva archivio, etichette e note in un file (per ripristinarlo usa Importa file)">Salva tutto</button>
 <span class="st" id="st"></span>
</header>
<div id="msg" class="msg" role="status" hidden></div>
<main>
 <aside class="pane fil" id="fil" aria-label="Filtri"></aside>
 <section class="pane list" aria-label="Elenco rapportini">
  <div id="bk"></div>
  <div id="arrb"></div>
  <div class="qr"><input class="q" id="q" type="search" placeholder="Cerca matricola, cliente, CV, RMA, codice errore…" aria-label="Cerca"><button class="b fbt" id="fbt" type="button">Filtri</button></div>
  <div class="act" id="act"></div>
  <div class="rie" id="rie" hidden></div>
  <div id="mh"></div>
  <div class="cnt" id="cn"></div>
  <div class="items" id="its"></div>
 </section>
 <section class="pane det" id="det" aria-label="Dettaglio"></section>
</main>
<div class="drop" id="drop" hidden>Rilascia qui i file da importare</div>
<script src="../shared.js"></script>
<script>
"use strict";
/* Archivio dei rapportini arrivati dall'app Glory 2.0 ("Archivio per il PC").
   I dati restano su questo PC: nel browser (IndexedDB) e, se collegata, in una cartella (un file per lavoro). */
var DB=null,L=[],SEL=null;
var TIT={inst:"Installazione",prep:"Preparazione",rip:"Riparazione",loc:"In loco",altro:"Altra attività",rit:"Ritiro"};
var PX={"CI-5":"50","CI-10":"100","CI-10X":"200"};
function $(i){return document.getElementById(i)}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function btn(c,x,fn){var b=el("button",c,x);b.type="button";b.onclick=fn;return b}
function p2(n){return n<10?"0"+n:""+n}
function dIt(t){var d=new Date(t);return p2(d.getDate())+"/"+p2(d.getMonth()+1)+"/"+d.getFullYear()}
function dLav(r){var m=/^(\d{4})-(\d\d)-(\d\d)$/.exec((r.s&&r.s.dt)||"");return m?m[3]+"/"+m[2]+"/"+m[1]:dIt(r.d)}
function tLav(r){var m=/^(\d{4})-(\d\d)-(\d\d)$/.exec((r.s&&r.s.dt)||"");return m?new Date(+m[1],+m[2]-1,+m[3]).getTime():r.d}
function g(s,k){return String(s[k]==null?"":s[k]).trim()}
function say(t,ko){var m=$("msg");m.textContent=t;m.className="msg"+(ko?" ko":"");m.hidden=!t;clearTimeout(say.t);if(t)say.t=setTimeout(function(){m.hidden=true},9000)}

/* ---------- matricole e codici impianto di un lavoro ---------- */
function mats(r){var s=r.s||{},o=[],i,v=r.v;
 function add(k,pre,n){n=String(n||"").trim();if(n)o.push({k:k,v:(pre||"")+n,n:n})}
 function dev(n,P){P=P||"";for(i=1;i<=n;i++){var px=PX[s[P+"m"+i]]||"";add("Banconote","RBW"+px+"-",s[P+"a"+i]);add("Monete","RCW"+px+"-",s[P+"c"+i]);add("Impianto","",s[P+"mt"+i])}}
 if(v==="inst"||v==="rit")dev(+s.n||(s.m1||s.a1||s.c1?1:0));
 if(v==="inst"&&s.rx)dev(+s.x_n||(s.x_m1||s.x_a1||s.x_c1?1:0),"x_");
 else if(v==="rip"){for(i=1;i<=(+s.rn||1);i++){var p="r"+i+"_",t=s[p+"tp"]==="Banconote"?"B":s[p+"tp"]==="Monete"?"C":"",px=PX[s[p+"md"]]||"";add(t==="B"?"Banconote":t==="C"?"Monete":"Modulo",t&&px?"R"+t+"W"+px+"-":"",s[p+"mat"])}}
 else if(v==="loc"){var q=PX[s.md]||"";add("Banconote",q?"RBW"+q+"-":"",s.r1_mat);add("Monete",q?"RCW"+q+"-":"",s.r2_mat);add("Impianto","",s.mt)}
 else if(v==="prep"){var z=PX[s.m]||"50";add("Banconote","RBW"+z+"-",s.mtB);add("Monete","RCW"+z+"-",s.mtM);for(i=2;i<=(+s.dn||1);i++)add("Monete","RCW50-",s["mtM"+i]);add("Impianto","",s.mtD)}
 else add("Matricola","",s.ma);
 return o}
function cliente(r){var s=r.s||{};return g(s,"cl")||g(s,"rvn")}
function rif(r){var s=r.s||{},o=[];if(g(s,"rma"))o.push("RMA "+g(s,"rma"));if(g(s,"cv"))o.push("CV "+g(s,"cv"));if(g(s,"cvc"))o.push("CV "+g(s,"cvc"));if(g(s,"rf"))o.push(g(s,"rf"));if(g(s,"rc"))o.push((s.rf||"")+" "+g(s,"rc"));return o.join(" · ")}
function testo(r){var s=r.s||{};return [r.n,r.tec,TIT[r.v],cliente(r),g(s,"rvn"),g(s,"se"),rif(r),r.nt].concat(mats(r).map(function(m){return m.v+" "+m.n})).join(" ").toLowerCase()}

/* ---------- archivio locale (IndexedDB) ---------- */
/* le foto stanno in un archivio a parte ("ph") e si caricano solo quando servono: l'avvio resta veloce anche con migliaia di lavori */
function dbOpen(){return new Promise(function(ok,ko){var q=indexedDB.open("glory_pc",2);q.onupgradeneeded=function(e){var d=q.result;if(e.oldVersion<1){d.createObjectStore("lav",{keyPath:"u"});d.createObjectStore("cfg")}
  if(e.oldVersion<2){var ps=d.createObjectStore("ph",{keyPath:"u"});if(e.oldVersion>=1){var ls=q.transaction.objectStore("lav");ls.openCursor().onsuccess=function(ev){var c=ev.target.result;if(!c)return;var r=c.value;if(Array.isArray(r.ph)){ps.put({u:r.u,ph:r.ph});r.nph=r.ph.length;delete r.ph;c.update(r)}c.continue()}}}};
 q.onsuccess=function(){DB=q.result;ok()};q.onerror=function(){ko(q.error)}})}
