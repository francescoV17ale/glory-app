<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f5f99">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="../icon-192.png">
<title>Glory Archivio</title>
<style>
:root{--bg:#f2f4f5;--sf:#fff;--tx:#14191d;--mu:#5b6770;--ln:#d5dbdf;--ac:#1f5f99;--on:#fff;--ok:#1f7a4d;--dg:#c23b22;--wn:#9a5b00;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#101417;--sf:#1a2025;--tx:#e8edf0;--mu:#97a4ad;--ln:#2d363d;--ac:#6fb3ea;--on:#0b1620;--ok:#5fc78f;--dg:#ff8a75;--wn:#f0b04a;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--ln);padding:10px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
header h1{margin:0;font-size:19px;flex:1 0 auto}
header h1 span{color:var(--mu);font-weight:400;font-size:14px;margin-left:8px}
.b{min-height:40px;padding:0 14px;border:1px solid var(--ln);background:var(--sf);border-radius:9px;font-weight:600}
.b.ac{background:var(--ac);border-color:var(--ac);color:var(--on)}
.b.sm{min-height:32px;padding:0 10px;font-size:13px;font-weight:500}
.st{font-size:13px;color:var(--mu)}
.st.ok{color:var(--ok)}.st.wn{color:var(--wn);font-weight:600}
main{display:grid;grid-template-columns:minmax(320px,440px) 1fr;gap:16px;padding:14px 18px;max-width:1500px;margin:0 auto}
@media (max-width:860px){main{grid-template-columns:1fr}}
.pane{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px;min-width:0}
.list{position:sticky;top:70px;max-height:calc(100vh - 90px);display:flex;flex-direction:column}
.q{width:100%;min-height:42px;border:1px solid var(--ln);border-radius:9px;padding:8px 12px;background:var(--bg)}
.fl{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.ch{min-height:30px;padding:0 10px;border:1px solid var(--ln);border-radius:15px;background:var(--sf);font-size:13px}
.ch.on{background:var(--ac);border-color:var(--ac);color:var(--on)}
.sel{min-height:30px;border:1px solid var(--ln);border-radius:15px;background:var(--sf);font-size:13px;padding:0 8px}
.cnt{font-size:13px;color:var(--mu);margin:2px 0 8px}
.items{overflow:auto;flex:1;margin:0 -4px;padding:0 4px}
.it{display:block;width:100%;text-align:left;border:1px solid var(--ln);border-left:5px solid var(--ac);border-radius:9px;background:var(--sf);padding:8px 10px;margin-bottom:6px}
.it.fat{border-left-color:var(--ok)}.it.cor{border-left-color:var(--wn)}
.it.on{outline:2px solid var(--ac)}
.it b{display:block;overflow-wrap:anywhere}.it span{display:block;font-size:12.5px;color:var(--mu)}
.mh{background:var(--bg);border:1px solid var(--ac);border-radius:9px;padding:8px 10px;margin-bottom:8px;font-size:13.5px}
.mh b{color:var(--ac)}
.det h2{margin:0 0 2px;font-size:20px;overflow-wrap:anywhere}
.det .sub{color:var(--mu);font-size:13px;margin-bottom:12px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;margin:0 0 14px;font-size:14px}
.kv dt{color:var(--mu)}.kv dd{margin:0;overflow-wrap:anywhere}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);margin:16px 0 6px}
.mats{display:flex;flex-wrap:wrap;gap:6px}
.mat{min-height:32px;padding:0 12px;border:1px dashed var(--ac);border-radius:16px;background:var(--sf);color:var(--ac);font-weight:600;font-variant-numeric:tabular-nums}
.mat i{font-style:normal;color:var(--mu);font-weight:400;margin-right:4px}
.note{white-space:pre-wrap;background:var(--bg);border:1px solid var(--ln);border-radius:9px;padding:12px;font-size:14px;margin:0}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.ph a{display:block;border:1px solid var(--ln);border-radius:8px;overflow:hidden;background:var(--bg)}
.ph img{display:block;width:100%;height:110px;object-fit:cover}
.ph span{display:block;font-size:11.5px;color:var(--mu);padding:3px 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.empty{color:var(--mu);text-align:center;padding:40px 10px}
.drop{position:fixed;inset:0;z-index:50;background:rgba(31,95,153,.18);border:4px dashed var(--ac);display:grid;place-items:center;font-size:22px;font-weight:700;color:var(--ac)}
.msg{margin:0 18px;padding:10px 14px;border-radius:9px;background:var(--sf);border:1px solid var(--ok);color:var(--ok);font-weight:600;max-width:1464px}
.msg.ko{border-color:var(--dg);color:var(--dg)}
.raw{font-size:12.5px;color:var(--mu)}
.raw summary{cursor:pointer}
.raw table{border-collapse:collapse;width:100%;margin-top:6px}.raw td{border-top:1px solid var(--ln);padding:3px 6px;vertical-align:top;overflow-wrap:anywhere}
.back{min-height:34px;padding:0 12px;border:1px solid var(--ac);color:var(--ac);background:var(--sf);border-radius:9px;font-weight:600;margin-bottom:8px}
.fr{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.fr input[type=date]{min-height:30px;border:1px solid var(--ln);border-radius:8px;background:var(--sf);padding:0 6px;font-size:13px}
.ch.frq{border-color:var(--wn);color:var(--wn)}.ch.frq.on{background:var(--wn);color:#fff}
.rie{font-size:12.5px;color:var(--mu);background:var(--bg);border-radius:8px;padding:6px 8px;margin:0 0 8px}
.rie b{color:var(--tx)}
.dots{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.tg{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 11px;border:1px solid var(--ln);border-radius:15px;background:var(--sf);font-size:13px}
.tg i{width:10px;height:10px;border-radius:50%;display:inline-block}
.tg.on{font-weight:700;border-width:2px}
.tgs{display:flex;flex-wrap:wrap;gap:6px}
.mynote{width:100%;min-height:70px;border:1px solid var(--ln);border-radius:9px;padding:8px 10px;background:var(--bg);resize:vertical;font:inherit}
.mac{border:2px solid var(--ac);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.mac h2{margin:0 0 4px;font-size:21px}
.big{font-size:22px;font-weight:700}
.stats{display:flex;flex-wrap:wrap;gap:16px;margin:8px 0 4px}.stats div{font-size:12.5px;color:var(--mu)}.stats b{display:block;font-size:18px;color:var(--tx)}
.fq{display:flex;justify-content:space-between;gap:8px}
.ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4);display:grid;place-items:center;padding:16px}
.dlg{background:var(--sf);border-radius:14px;padding:16px 18px;width:min(520px,100%);max-height:90vh;overflow:auto}
.dlg h2{margin:0 0 10px;font-size:19px}
.er{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.er input[type=text]{flex:1;min-height:36px;border:1px solid var(--ln);border-radius:8px;padding:0 10px;background:var(--bg)}
.er select{min-height:36px;border:1px solid var(--ln);border-radius:8px;background:var(--bg)}
.er .x{min-height:36px;min-width:36px;border:1px solid var(--dg);color:var(--dg);background:var(--sf);border-radius:8px}
a.b{display:inline-flex;align-items:center;text-decoration:none;color:var(--tx)}
</style>
</head>
<body>
<header>
 <h1>Glory Archivio <span>sul PC</span></h1>
 <label class="b ac" style="display:inline-flex;align-items:center;position:relative">Importa file<input id="fi" type="file" multiple accept=".txt,.json,text/plain,application/json" style="position:absolute;inset:0;opacity:0;cursor:pointer" aria-label="Importa file dall'app"></label>
 <button class="b" id="dirb" type="button"></button>
 <button class="b" id="sync" type="button" hidden title="Rileggi la cartella">Aggiorna</button>
 <button class="b" id="tagb" type="button">Etichette</button>
 <button class="b" id="csv" type="button">Esporta Excel</button>
 <button class="b" id="bak" type="button" title="Salva archivio, etichette e note in un file (per ripristinarlo usa Importa file)">Salva tutto</button>
 <a class="b" id="extl" href="Glory-Archivio-estensione.zip" download>Estensione Chrome</a>
 <span class="st" id="st"></span>
</header>
<div id="msg" class="msg" role="status" hidden></div>
<main>
 <section class="pane list" aria-label="Elenco rapportini">
  <div id="bk"></div>
  <input class="q" id="q" type="search" placeholder="Cerca matricola, cliente, CV, RMA, tecnico…" aria-label="Cerca">
  <div class="fl" id="fl"></div>
  <div class="fr" id="fr"></div>
  <div class="rie" id="rie" hidden></div>
  <div id="mh"></div>
  <div class="cnt" id="cn"></div>
  <div class="items" id="its"></div>
 </section>
 <section class="pane det" id="det" aria-label="Dettaglio"></section>
</main>
<div class="drop" id="drop" hidden>Rilascia qui i file da importare</div>
<script>
"use strict";
/* Archivio dei rapportini arrivati dall'app Glory 2.0 ("Archivio per il PC").
   I dati restano su questo PC: nel browser (IndexedDB) e, se collegata, in una cartella (un file per lavoro). */
var DB=null,L=[],SEL=null,F={q:"",v:"",t:""},DIR=null;
var TIT={inst:"Installazione",prep:"Preparazione",rip:"Riparazione",loc:"In loco",altro:"Altra attività",rit:"Ritiro"};
var PX={"CI-5":"50","CI-10":"100","CI-10X":"200"};
function $(i){return document.getElementById(i)}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function btn(c,x,fn){var b=el("button",c,x);b.type="button";b.onclick=fn;return b}
function p2(n){return n<10?"0"+n:""+n}
function dIt(t){var d=new Date(t);return p2(d.getDate())+"/"+p2(d.getMonth()+1)+"/"+d.getFullYear()}
function dLav(r){var m=/^(\d{4})-(\d\d)-(\d\d)$/.exec((r.s&&r.s.dt)||"");return m?m[3]+"/"+m[2]+"/"+m[1]:dIt(r.d)}
function tLav(r){var m=/^(\d{4})-(\d\d)-(\d\d)$/.exec((r.s&&r.s.dt)||"");return m?new Date(+m[1],+m[2]-1,+m[3]).getTime():r.d}
function g(s,k){return String(s[k]==null?"":s[k]).trim()}
function say(t,ko){var m=$("msg");m.textContent=t;m.className="msg"+(ko?" ko":"");m.hidden=!t;clearTimeout(say.t);if(t)say.t=setTimeout(function(){m.hidden=true},9000)}

/* ---------- matricole e codici impianto di un lavoro ---------- */
function mats(r){var s=r.s||{},o=[],i,v=r.v;
 function add(k,pre,n){n=String(n||"").trim();if(n)o.push({k:k,v:(pre||"")+n,n:n})}
 function dev(n){for(i=1;i<=n;i++){var px=PX[s["m"+i]]||"";add("Banconote","RBW"+px+"-",s["a"+i]);add("Monete","RCW"+px+"-",s["c"+i]);add("Impianto","",s["mt"+i])}}
 if(v==="inst"||v==="rit")dev(+s.n||(s.m1||s.a1||s.c1?1:0));
 else if(v==="rip"){for(i=1;i<=(+s.rn||1);i++){var p="r"+i+"_",t=s[p+"tp"]==="Banconote"?"B":s[p+"tp"]==="Monete"?"C":"",px=PX[s[p+"md"]]||"";add(t==="B"?"Banconote":t==="C"?"Monete":"Modulo",t&&px?"R"+t+"W"+px+"-":"",s[p+"mat"])}}
 else if(v==="loc"){var q=PX[s.md]||"";add("Banconote",q?"RBW"+q+"-":"",s.r1_mat);add("Monete",q?"RCW"+q+"-":"",s.r2_mat);add("Impianto","",s.mt)}
 else if(v==="prep"){var z=PX[s.m]||"50";add("Banconote","RBW"+z+"-",s.mtB);add("Monete","RCW"+z+"-",s.mtM);for(i=2;i<=(+s.dn||1);i++)add("Monete","RCW50-",s["mtM"+i]);add("Impianto","",s.mtD)}
 else add("Matricola","",s.ma);
 return o}
function cliente(r){var s=r.s||{};return g(s,"cl")||g(s,"rvn")}
function rif(r){var s=r.s||{},o=[];if(g(s,"rma"))o.push("RMA "+g(s,"rma"));if(g(s,"cv"))o.push("CV "+g(s,"cv"));if(g(s,"cvc"))o.push("CV "+g(s,"cvc"));if(g(s,"rf"))o.push(g(s,"rf"));if(g(s,"rc"))o.push((s.rf||"")+" "+g(s,"rc"));return o.join(" · ")}
function testo(r){var s=r.s||{};return [r.n,r.tec,TIT[r.v],cliente(r),g(s,"rvn"),g(s,"se"),rif(r),r.nt].concat(mats(r).map(function(m){return m.v+" "+m.n})).join(" ").toLowerCase()}

/* ---------- archivio locale (IndexedDB) ---------- */
function dbOpen(){return new Promise(function(ok,ko){var q=indexedDB.open("glory_pc",1);q.onupgradeneeded=function(){var d=q.result;d.createObjectStore("lav",{keyPath:"u"});d.createObjectStore("cfg")};q.onsuccess=function(){DB=q.result;ok()};q.onerror=function(){ko(q.error)}})}
function dbAll(){return new Promise(function(ok){var t=DB.transaction("lav").objectStore("lav").getAll();t.onsuccess=function(){ok(t.result||[])};t.onerror=function(){ok([])}})}
function dbPut(arr){return new Promise(function(ok,ko){if(!arr.length){ok();return}var t=DB.transaction("lav","readwrite"),st=t.objectStore("lav");arr.forEach(function(r){st.put(r)});t.oncomplete=ok;t.onerror=t.onabort=function(){ko(t.error)}})}
function cfg(k,v){return new Promise(function(ok){var t=DB.transaction("cfg",v===undefined?"readonly":"readwrite"),st=t.objectStore("cfg"),q=v===undefined?st.get(k):st.put(v,k);q.onsuccess=function(){ok(q.result)};q.onerror=function(){ok(null)}})}

/* ---------- cartella sul PC (Chrome/Edge): un file .json per lavoro ---------- */
var FSA=!!window.showDirectoryPicker;
function dirLabel(){var b=$("dirb");if(!FSA){b.hidden=true;return}b.hidden=false;b.textContent=DIR?(DIR.ok?"Cartella: "+DIR.h.name:"Riapri la cartella "+DIR.h.name):"Collega una cartella";$("sync").hidden=!(DIR&&DIR.ok)}
function dirPick(){if(DIR&&!DIR.ok){DIR.h.requestPermission({mode:"readwrite"}).then(function(p){if(p==="granted"){DIR.ok=1;dirSync()}dirLabel()});return}
 window.showDirectoryPicker({mode:"readwrite",id:"glory-archivio"}).then(function(h){DIR={h:h,ok:1};SEEN={};cfg("seen",SEEN);cfg("dir",h);dirSync();dirLabel()},function(){})}
function dirInit(){if(!FSA)return Promise.resolve();return cfg("seen").then(function(x){SEEN=x||{}}).then(function(){return cfg("dir")}).then(function(h){if(!h)return;DIR={h:h,ok:0};return h.queryPermission({mode:"readwrite"}).then(function(p){if(p==="granted"){DIR.ok=1;return dirSync()}})}).catch(function(){})}
/* nella cartella (anche una cartella condivisa di Google Drive):
   - i file "Archivio Glory …" che arrivano dai tecnici vengono importati da soli
   - la copia dell'archivio va nella sottocartella _archivio (un file .json per lavoro) */
var SUB="_archivio",SEEN={};
function subDir(){return DIR.h.getDirectoryHandle(SUB,{create:true})}
function dirWrite(arr){if(!DIR||!DIR.ok||!arr.length)return Promise.resolve();
 return subDir().then(function(sd){return arr.reduce(function(pr,r){return pr.then(function(){return sd.getFileHandle(fnSafe(r.u)+".json",{create:true}).then(function(fh){return fh.createWritable()}).then(function(w){return w.write(JSON.stringify(r)).then(function(){return w.close()})})})},Promise.resolve())}).catch(function(){say("Non riesco a scrivere nella cartella: ricollegala.",1)})}
function fnSafe(t){return String(t).replace(/[^A-Za-z0-9_-]/g,"_")}
var syncing=0;
function dirSync(){if(!DIR||!DIR.ok||syncing)return Promise.resolve();syncing=1;var got={},inc=[],nf=0;
 return (async function(){
  for await (var e of DIR.h.values()){if(e.kind!=="file"||!/\.(txt|json)$/i.test(e.name))continue;
   var f=await e.getFile(),key=e.name+"|"+f.size+"|"+f.lastModified;if(SEEN[key])continue;
   var o=null;try{o=JSON.parse(await f.text())}catch(x){}SEEN[key]=1;
   if(o&&o.u&&o.s&&o.v){got[o.u]=o;continue}            /* copia di un lavoro lasciata nella cartella principale (versione precedente) */
   var A=o?norm(o):[];if(A.length){nf++;inc=inc.concat(A)}}
  var sd=await subDir();
  for await (var e2 of sd.values()){if(e2.kind!=="file"||!/\.json$/.test(e2.name))continue;var f2=await e2.getFile(),k2=SUB+"/"+e2.name+"|"+f2.size+"|"+f2.lastModified;if(SEEN[k2])continue;SEEN[k2]=1;try{var r=JSON.parse(await f2.text());if(e2.name==="_meta.json"){if(r&&+r.ts>(+META.ts||0)){META=metaFix(r);cfg("meta",META)}else if(r&&metaMerge(r))metaSave()}else if(r&&r.u)got[r.u]=r}catch(x){}}
 })().then(function(){
  var M={},toDb=[],nu=0,ag=0;L.forEach(function(r){M[r.u]=r});
  Object.keys(got).forEach(function(u){var r=got[u];if(!M[u]||r.d>M[u].d){toDb.push(r);M[u]=r}});
  var toDir=[];inc.forEach(function(r){var e=M[r.u];if(!e){nu++;M[r.u]=r;toDb.push(r);toDir.push(r)}else if(r.d>e.d){ag++;M[r.u]=r;toDb.push(r);toDir.push(r)}});
  L.forEach(function(r){if(!got[r.u]&&toDir.indexOf(r)<0&&!SEEN["w|"+r.u+"|"+r.d])toDir.push(r)});
  L=Object.keys(M).map(function(u){return M[u]});
  return dbPut(toDb).then(function(){return dirWrite(toDir)}).then(metaDir).then(function(){toDir.forEach(function(r){SEEN["w|"+r.u+"|"+r.d]=1});cfg("seen",SEEN);
   if(nu||ag)say("Dalla cartella: "+nu+(nu===1?" nuovo":" nuovi")+(ag?", "+ag+(ag===1?" aggiornato":" aggiornati"):"")+".");draw()})})
 .catch(function(){say("Lettura della cartella non riuscita: ricollegala.",1)}).then(function(){syncing=0})}
/* torna sulla finestra o tocca Aggiorna: rilegge la cartella */
window.addEventListener("focus",function(){if(DIR&&DIR.ok)dirSync()});

/* ---------- etichette e note personali (solo su questo PC e nella cartella collegata) ---------- */
var COL=["#c23b22","#d97706","#ca8a04","#1f7a4d","#0f766e","#1f5f99","#6d28d9","#be185d","#5b6770"];
var META={tags:[],L:{},M:{},ts:0};
function metaFix(m){m=m&&typeof m==="object"?m:{};return {tags:Array.isArray(m.tags)?m.tags:[],L:m.L&&typeof m.L==="object"?m.L:{},M:m.M&&typeof m.M==="object"?m.M:{},ts:+m.ts||0}}
function metaDef(){var n=["Da fatturare","Garanzia","Cliente critico","Da richiamare","Ricambio in ordine","Macchina problematica"],c=[1,5,0,2,6,7];
 return {tags:n.map(function(x,i){return {id:"t"+(i+1),n:x,c:COL[c[i]]}}),L:{},M:{},ts:0}}
/* unisce etichette e note di un altro archivio: aggiunge quelle che mancano, non cancella niente */
function metaMerge(m){m=metaFix(m);var ch=0;m.tags.forEach(function(t){var e=tagOf(t.id);if(!e){META.tags.push(t);ch=1}});
 ["L","M"].forEach(function(k){Object.keys(m[k]).forEach(function(x){var a=META[k][x],b=m[k][x];if(!a){META[k][x]=b;ch=1;return}
  (b.t||[]).forEach(function(id){if(a.t.indexOf(id)<0){a.t.push(id);ch=1}});if(b.n&&!a.n){a.n=b.n;ch=1}})});return ch}
var mdT=null;
function metaSave(){META.ts=Date.now();cfg("meta",META);clearTimeout(mdT);mdT=setTimeout(metaDir,800)}
function metaDir(){if(!DIR||!DIR.ok)return Promise.resolve();return subDir().then(function(sd){return sd.getFileHandle("_meta.json",{create:true})}).then(function(fh){return fh.createWritable()}).then(function(w){return w.write(JSON.stringify(META)).then(function(){return w.close()})}).catch(function(){})}
function mk(v){return String(v||"").toUpperCase().replace(/\s+/g,"")}
function slot(kind,k){var o=META[kind][k];if(!o){o={t:[],n:""};META[kind][k]=o}return o}
function clean(kind,k){var o=META[kind][k];if(o&&!o.t.length&&!String(o.n||"").trim())delete META[kind][k]}
function tagOf(id){return META.tags.filter(function(t){return t.id===id})[0]}
function tagsL(r){var o=(META.L[r.u]||{}).t||[],M=mats(r);M.forEach(function(m){((META.M[mk(m.v)]||{}).t||[]).forEach(function(t){if(o.indexOf(t)<0)o=o.concat(t)})});return o.filter(tagOf)}
function tagRow(kind,k){var w=el("div","tgs"),o=META[kind][k]||{t:[]};
