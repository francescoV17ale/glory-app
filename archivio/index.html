<!DOCTYPE html>
<html lang="it">

<style>
:root{--bg:#f2f4f5;--sf:#fff;--tx:#14191d;--mu:#5b6770;--ln:#d5dbdf;--ac:#1f5f99;--on:#fff;--ok:#1f7a4d;--dg:#c23b22;--wn:#9a5b00;color-scheme:light}

*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}

.pane{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px;min-width:0}

.it.fat{border-left-color:var(--ok)}.it.cor{border-left-color:var(--wn)}
.it.on{outline:2px solid var(--ac)}

.ch.nwc{border-color:var(--ac);color:var(--ac);font-weight:700}.ch.nwc.on{background:var(--ac);color:var(--on)}
.er label,.er b{white-space:nowrap}
.mynote{width:100%;min-height:70px;border:1px solid var(--ln);border-radius:9px;padding:8px 10px;background:var(--bg);resize:vertical;font:inherit}

.mac h2{margin:0 0 4px;font-size:21px}
.big{font-size:22px;font-weight:700}
.stats{display:flex;flex-wrap:wrap;gap:16px;margin:8px 0 4px}.stats div{font-size:12.5px;color:var(--mu)}.stats b{display:block;font-size:18px;color:var(--tx)}
.fq{display:flex;justify-content:space-between;gap:8px}
.ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4);display:grid;place-items:center;padding:16px}
.dlg{background:var(--sf);border-radius:14px;padding:16px 18px;width:min(520px,100%);max-height:90vh;overflow:auto}
.dlg h2{margin:0 0 10px;font-size:19px}
.er{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.er input[type=text]{flex:1;min-height:36px;border:1px solid var(--ln);border-radius:8px;padding:0 10px;background:var(--bg)}
.er select{min-height:36px;border:1px solid var(--ln);border-radius:8px;background:var(--bg)}
.er .x{min-height:36px;min-width:36px;border:1px solid var(--dg);color:var(--dg);background:var(--sf);border-radius:8px}
a.b{display:inline-flex;align-items:center;text-decoration:none;color:var(--tx)}
</style>
</head>
<body>
<header>
 <h1>Glory Archivio <span>sul PC</span></h1>
 <label class="b ac" style="display:inline-flex;align-items:center;position:relative">Importa file<input id="fi" type="file" multiple accept=".txt,.json,text/plain,application/json" style="position:absolute;inset:0;opacity:0;cursor:pointer" aria-label="Importa file dall'app"></label>

</main>
<div class="drop" id="drop" hidden>Rilascia qui i file da importare</div>
<script>
"use strict";
/* Archivio dei rapportini arrivati dall'app Glory 2.0 ("Archivio per il PC").
   I dati restano su questo PC: nel browser (IndexedDB) e, se collegata, in una cartella (un file per lavoro). */
var DB=null,L=[],SEL=null,F={q:"",v:"",t:""},DIR=null;
var TIT={inst:"Installazione",prep:"Preparazione",rip:"Riparazione",loc:"In loco",altro:"Altra attività",rit:"Ritiro"};

function $(i){return document.getElementById(i)}

function p2(n){return n<10?"0"+n:""+n}
function dIt(t){var d=new Date(t);return p2(d.getDate())+"/"+p2(d.getMonth()+1)+"/"+d.getFullYear()}
function dLav(r){var m=/^(\d{4})-(\d\d)-(\d\d)$/.exec((r.s&&r.s.dt)||"");return m?m[3]+"/"+m[2]+"/"+m[1]:dIt(r.d)}

function g(s,k){return String(s[k]==null?"":s[k]).trim()}
function say(t,ko){var m=$("msg");m.textContent=t;m.className="msg"+(ko?" ko":"");m.hidden=!t;clearTimeout(say.t);if(t)say.t=setTimeout(function(){m.hidden=true},9000)}

/* ---------- matricole e codici impianto di un lavoro ---------- */
function mats(r){var s=r.s||{},o=[],i,v=r.v;
 function add(k,pre,n){n=String(n||"").trim();if(n)o.push({k:k,v:(pre||"")+n,n:n})}
 function dev(n){for(i=1;i<=n;i++){var px=PX[s["m"+i]]||"";add("Banconote","RBW"+px+"-",s["a"+i]);add("Monete","RCW"+px+"-",s["c"+i]);add("Impianto","",s["mt"+i])}}
 if(v==="inst"||v==="rit")dev(+s.n||(s.m1||s.a1||s.c1?1:0));
 else if(v==="rip"){for(i=1;i<=(+s.rn||1);i++){var p="r"+i+"_",t=s[p+"tp"]==="Banconote"?"B":s[p+"tp"]==="Monete"?"C":"",px=PX[s[p+"md"]]||"";add(t==="B"?"Banconote":t==="C"?"Monete":"Modulo",t&&px?"R"+t+"W"+px+"-":"",s[p+"mat"])}}
 else if(v==="loc"){var q=PX[s.md]||"";add("Banconote",q?"RBW"+q+"-":"",s.r1_mat);add("Monete",q?"RCW"+q+"-":"",s.r2_mat);add("Impianto","",s.mt)}
 else if(v==="prep"){var z=PX[s.m]||"50";add("Banconote","RBW"+z+"-",s.mtB);add("Monete","RCW"+z+"-",s.mtM);for(i=2;i<=(+s.dn||1);i++)add("Monete","RCW50-",s["mtM"+i]);add("Impianto","",s.mtD)}
 else add("Matricola","",s.ma);
 return o}
function cliente(r){var s=r.s||{};return g(s,"cl")||g(s,"rvn")}
function rif(r){var s=r.s||{},o=[];if(g(s,"rma"))o.push("RMA "+g(s,"rma"));if(g(s,"cv"))o.push("CV "+g(s,"cv"));if(g(s,"cvc"))o.push("CV "+g(s,"cvc"));if(g(s,"rf"))o.push(g(s,"rf"));if(g(s,"rc"))o.push((s.rf||"")+" "+g(s,"rc"));return o.join(" · ")}
function testo(r){var s=r.s||{};return [r.n,r.tec,TIT[r.v],cliente(r),g(s,"rvn"),g(s,"se"),rif(r),r.nt].concat(mats(r).map(function(m){return m.v+" "+m.n})).join(" ").toLowerCase()}

/* ---------- archivio locale (IndexedDB) ---------- */
function dbOpen(){return new Promise(function(ok,ko){var q=indexedDB.open("glory_pc",1);q.onupgradeneeded=function(){var d=q.result;d.createObjectStore("lav",{keyPath:"u"});d.createObjectStore("cfg")};q.onsuccess=function(){DB=q.result;ok()};q.onerror=function(){ko(q.error)}})}
function dbAll(){return new Promise(function(ok){var t=DB.transaction("lav").objectStore("lav").getAll();t.onsuccess=function(){ok(t.result||[])};t.onerror=function(){ok([])}})}
function dbPut(arr){return new Promise(function(ok,ko){if(!arr.length){ok();return}var t=DB.transaction("lav","readwrite"),st=t.objectStore("lav");arr.forEach(function(r){st.put(r)});t.oncomplete=ok;t.onerror=t.onabort=function(){ko(t.error)}})}
function cfg(k,v){return new Promise(function(ok){var t=DB.transaction("cfg",v===undefined?"readonly":"readwrite"),st=t.objectStore("cfg"),q=v===undefined?st.get(k):st.put(v,k);q.onsuccess=function(){ok(q.result)};q.onerror=function(){ok(null)}})}

/* ---------- cartella sul PC (Chrome/Edge): un file .json per lavoro ---------- */
var FSA=!!window.showDirectoryPicker;
function dirLabel(){var b=$("dirb");if(!FSA&&!GD.ok){b.hidden=true;return}b.hidden=false;
 b.textContent=GDON?(gTokC()?"Google Drive":"Google Drive · accedi")+(DIR&&DIR.ok?" + "+DIR.h.name:""):DIR?(DIR.ok?"Cartella: "+DIR.h.name:"Riapri la cartella "+DIR.h.name):FSA?"Collega una cartella":"Collega Google Drive";$("sync").hidden=!(DIR&&DIR.ok||GDON)}
function dirPick(){if(DIR&&!DIR.ok){DIR.h.requestPermission({mode:"readwrite"}).then(function(p){if(p==="granted"){DIR.ok=1;dirSync()}dirLabel()});return}
 window.showDirectoryPicker({mode:"readwrite",id:"glory-archivio"}).then(function(h){DIR={h:h,ok:1};SEEN={};cfg("seen",SEEN);cfg("dir",h);dirSync();dirLabel()},function(){})}
function dirInit(){if(!FSA)return Promise.resolve();return cfg("seen").then(function(x){SEEN=x||{}}).then(function(){return cfg("dir")}).then(function(h){if(!h)return;DIR={h:h,ok:0};return h.queryPermission({mode:"readwrite"}).then(function(p){if(p==="granted"){DIR.ok=1;return dirSync()}})}).catch(function(){})}
/* nella cartella (anche una cartella condivisa di Google Drive):
   - i file "Archivio Glory …" che arrivano dai tecnici vengono importati da soli
   - in _archivio ogni PC scrive solo il suo file _team-<codice>.json (etichette e commenti di squadra)
   - le copie dei lavori in _archivio (versione precedente) vengono ancora lette, non più scritte */
var SUB="_archivio",SEEN={};
function subDir(){return DIR.h.getDirectoryHandle(SUB,{create:true})}
function fnSafe(t){return String(t).replace(/[^A-Za-z0-9_-]/g,"_")}
var syncing=0;
function dirSync(){if(!DIR||!DIR.ok||syncing)return Promise.resolve();syncing=1;var got={},inc=[],nf=0,tms=[],mtOld=null;
 return (async function(){
  for await (var e of DIR.h.values()){if(e.kind!=="file"||!/\.(txt|json)$/i.test(e.name))continue;
   var f=await e.getFile(),key=e.name+"|"+f.size+"|"+f.lastModified;if(SEEN[key])continue;
   var o=null;try{o=JSON.parse(await f.text())}catch(x){}SEEN[key]=1;
   if(o&&o.u&&o.s&&o.v){got[o.u]=o;continue}            /* copia di un lavoro lasciata nella cartella principale (versione precedente) */
   var A=o?norm(o):[];if(A.length){nf++;inc=inc.concat(A)}}
  try{var rmd=await DIR.h.getDirectoryHandle("_rma",{create:false});for await (var e5 of rmd.values()){if(e5.kind!=="file"||!/\.json$/i.test(e5.name))continue;var f5=await e5.getFile(),k5="_rma/"+e5.name+"|"+f5.size+"|"+f5.lastModified;if(SEEN[k5])continue;SEEN[k5]=1;try{inc=inc.concat(norm(JSON.parse(await f5.text())))}catch(x){}}}catch(x){}
  try{var mdd=await DIR.h.getDirectoryHandle("_modifiche",{create:false});for await (var e4 of mdd.values()){if(e4.kind!=="file"||!/\.json$/i.test(e4.name))continue;var f4=await e4.getFile(),k4="_modifiche/"+e4.name+"|"+f4.size+"|"+f4.lastModified;if(SEEN[k4])continue;SEEN[k4]=1;try{var o4=JSON.parse(await f4.text());inc=inc.concat(norm(o4))}catch(x){}}}catch(x){}
  try{var imd=await DIR.h.getDirectoryHandle("_importati",{create:false});for await (var e3 of imd.values()){if(e3.kind!=="file"||!/\.(txt|json)$/i.test(e3.name))continue;var f3=await e3.getFile(),k3="_importati/"+e3.name+"|"+f3.size;if(SEEN[k3])continue;SEEN[k3]=1;try{var o3=JSON.parse(await f3.text());var A3=norm(o3);if(A3.length)inc=inc.concat(A3)}catch(x){}}}catch(x){}
  var sd=await subDir();
  for await (var e2 of sd.values()){if(e2.kind!=="file"||!/\.json$/.test(e2.name))continue;var f2=await e2.getFile(),k2=SUB+"/"+e2.name+"|"+f2.size+"|"+f2.lastModified;if(SEEN[k2])continue;SEEN[k2]=1;try{var r=JSON.parse(await f2.text());if(/^_team-/.test(e2.name)){tms.push(r)}else if(r&&r.u)got[r.u]=r}catch(x){}}
 })().then(function(){return unisci(got,inc,tms,mtOld,"Dalla cartella")})
 .catch(function(){say("Lettura della cartella non riuscita: ricollegala.",1)}).then(function(){syncing=0})}
function unisci(got,inc,tms,mtOld,da){
  var M={},toDb=[],nu=0,ag=0;L.forEach(function(r){M[r.u]=r});
  Object.keys(got).forEach(function(u){var r=got[u];if(!M[u]||r.d>M[u].d){toDb.push(r);M[u]=r}});
